<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Acadêmico - Login Responsivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-container">
        <section class="login-box">
            <header class="login-header">
                <h1>Acesso ao Portal</h1>
                <p>Use suas credenciais acadêmicas</p>
            </header>

            <form action="#" method="POST" class="login-form">
                <div class="form-group">
                    <label for="matricula">Matrícula</label>
                    <input type="text" id="matricula" name="matricula" required 
                           placeholder="Ex: 202310100" aria-required="true">
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required 
                           placeholder="••••••••" aria-required="true">
                </div>

                <div class="form-actions">
                    <a href="#" class="link-secondary">Esqueci minha senha</a>
                </div>

                <div class="submit-container">
                    <button type="submit" class="btn-primary">Entrar no Sistema</button>
                    <div class="envio-status-aviso" aria-live="polite">Dados enviados</div>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
